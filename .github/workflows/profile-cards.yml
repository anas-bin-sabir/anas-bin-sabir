name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # Runs daily at 03:00 UTC
  push:
    paths:
      - ".github/workflows/profile-cards.yml" # Re-run whenever this file changes
  workflow_dispatch: # Lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D1117&ring=5B8DEF&fire=5B8DEF&currStreakNum=FFFFFF&currStreakLabel=FFFFFF&sideLabels=FFFFFF&sideNums=C9D1D9&dates=6E7681&stroke=5B8DEF
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy.svg
          theme: darkhub
          no-frame: true
          max-cols: 7
          margin-width: 8
          margin-height: 8
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          mkdir -p profile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --staged --quiet && echo "Nothing to commit" || (git commit -m "Update profile cards" && git push)
